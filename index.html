<style>
  :root{
    color-scheme:dark;
    --bg:#121214; --surface:#1a1a19; --surface-2:#232321;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  h1 span{background:linear-gradient(90deg,#ff5fa2,#ffb35c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--ring);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%}
  .card{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--ring);padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  .tile{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--ring);padding:12px 14px}
  .tile .k{font-size:12px;color:var(--text-2)}
  .tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .h{font-size:12px;color:var(--muted)}
  @media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
  .chip{border:0;font:inherit;font-size:13px;color:var(--text-2);background:var(--surface-2);
    padding:7px 12px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed=true]{background:var(--text);color:#121214;font-weight:600}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  svg text{fill:var(--muted);font-size:10px}
  .chart{position:relative}
  .tip{position:absolute;pointer-events:none;background:#000;color:var(--text);font-size:12px;padding:6px 8px;
    border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap;opacity:0;transition:opacity .1s}
  .row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--grid);text-decoration:none;color:inherit}
  .row:first-child{border-top:0}
  .thumb{width:54px;height:72px;border-radius:8px;object-fit:cover;background:var(--surface-2);flex:none}
  .meta{min-width:0;flex:1}
  .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .small{font-size:12px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2)}
  .tag i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .run{padding:10px 0;border-top:1px solid var(--grid)}
  .run:first-child{border-top:0}
  .run .top{display:flex;justify-content:space-between;gap:8px}
  .run a{color:var(--text-2);font-size:12px}
  .prob{font-size:12px;color:var(--text-2);margin-top:4px}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  .more{width:100%;margin-top:8px}
  details summary{cursor:pointer;color:var(--text-2);font-size:12px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  td,th{text-align:left;padding:4px 6px;border-top:1px solid var(--grid)}
  th{color:var(--text-2);font-weight:600}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

</div>

const COLORS = ["var(--s1)","var(--s2)"];
const colorOf = name => COLORS[Math.max(0, DATA.channels.indexOf(name)) % COLORS.length];
const TZ = "Europe/Amsterdam";
const fmt = (iso, opts) => new Date(iso).toLocaleString("en-GB", {timeZone: TZ, ...opts});
const dayKey = iso => new Date(iso).toLocaleDateString("en-CA", {timeZone: TZ});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(iso){
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " d ago";
}

// ---------- header + status
const last = DATA.runs[0];
document.getElementById("updated").textContent = last
  ? "Last run " + fmt(last.started, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})
  : "No runs yet";
const st = document.getElementById("status");
if (!last) st.innerHTML = '<span class="dot" style="background:var(--muted)"></span>Waiting';
else if (!last.problems || !last.problems.length) st.innerHTML = '<span class="dot" style="background:var(--good)"></span>✓ All good';
else st.innerHTML = '<span class="dot" style="background:var(--bad)"></span>⚠ Problems';

// ---------- tiles
function nextRun(){
  const [mi, h] = DATA.cron.split(" ").map(Number);
  const now = new Date(), t = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), h, mi));
  if (t <= now) t.setUTCDate(t.getUTCDate() + 1);
  return t;
}
const today = dayKey(new Date().toISOString());
const weekAgo = Date.now() - 7 * 864e5;
const tiles = [
  ["Uploaded today", DATA.uploads.filter(u => dayKey(u.at) === today).length, "across all channels"],
  ["Last 7 days", DATA.uploads.filter(u => new Date(u.at) > weekAgo).length, "videos"],
  ["All time", DATA.uploads.length, DATA.channels.length + " channel" + (DATA.channels.length > 1 ? "s" : "")],
  ["Next run", fmt(nextRun().toISOString(), {hour:"2-digit", minute:"2-digit"}), fmt(nextRun().toISOString(), {weekday:"long"})],
];
document.getElementById("tiles").innerHTML = tiles.map(([k, v, h]) =>
  `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="h">${h}</div></div>`).join("");

// ---------- chart: grouped bars, uploads per day per channel
const days = [];
for (let i = 13; i >= 0; i--) days.push(dayKey(new Date(Date.now() - i * 864e5).toISOString()));
const counts = DATA.channels.map(ch => days.map(d => DATA.uploads.filter(u => u.channel === ch && dayKey(u.at) === d).length));
document.getElementById("legend").innerHTML = DATA.channels.length > 1
  ? DATA.channels.map(ch => `<span><i style="background:${colorOf(ch)}"></i>${esc(ch)}</span>`).join("") : "";
(function drawChart(){
  const el = document.getElementById("chart"), W = el.clientWidth || 340, H = 170, L = 24, B = 22, T = 8;
  const max = Math.max(4, ...counts.flat());
  const step = Math.ceil(max / 4), top = step * 4;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L) / days.length, n = DATA.channels.length, gap = 2;
  const bw = Math.max(3, Math.min(14, (gw - 6 - gap * (n - 1)) / n));
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="Uploads per day">`;
  for (let v = 0; v <= top; v += step)
    s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "var(--grid)" : "var(--axis)"}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  days.forEach((d, i) => {
    const gx = L + i * gw + (gw - (bw * n + gap * (n - 1))) / 2;
    counts.forEach((c, k) => {
      const v = c[i]; if (!v) return;
      const x = gx + k * (bw + gap), h = y(0) - y(v), r = Math.min(4, bw / 2, h);
      s += `<path d="M${x},${y(0)}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + bw - r}Q${x + bw},${y(v)} ${x + bw},${y(v) + r}V${y(0)}Z" fill="${colorOf(DATA.channels[k])}"/>`;
    });
    if (i % 2 === 1 || days.length <= 7) s += `<text x="${L + i * gw + gw / 2}" y="${H - 6}" text-anchor="middle">${+d.slice(8)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * gw}" y="0" width="${gw}" height="${H - B}" fill="transparent"/>`;
  });
  s += `</svg><div class="tip" id="tip"></div>`;
  el.innerHTML = s;
  const tip = document.getElementById("tip");
  el.querySelectorAll(".hit").forEach(r => {
    const show = () => {
      const i = +r.dataset.i;
      tip.innerHTML = `<b>${fmt(days[i] + "T12:00:00Z", {weekday:"short", day:"numeric", month:"short"})}</b><br>` +
        DATA.channels.map((ch, k) => `${esc(ch)}: ${counts[k][i]}`).join("<br>");
      tip.style.opacity = 1;
      const x = +r.getAttribute("x") + gw / 2;
      tip.style.left = Math.min(Math.max(0, x - 60), W - 130) + "px"; tip.style.top = "4px";
    };
    r.addEventListener("mouseenter", show); r.addEventListener("click", show);
    r.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
})();
document.getElementById("chartTable").innerHTML =
  `<table><tr><th>Day</th>${DATA.channels.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
  days.slice().reverse().map((d, j) => { const i = days.length - 1 - j;
    return `<tr><td>${d}</td>${counts.map(c => `<td class="n">${c[i]}</td>`).join("")}</tr>`; }).join("") + `</table>`;

// ---------- uploads list with channel filter
let filter = "All", shown = 15;
function renderFilters(){
  document.getElementById("filters").innerHTML = ["All", ...DATA.channels].map(f =>
    `<button class="chip" aria-pressed="${f === filter}" data-f="${esc(f)}">${f === "All" ? "" : `<i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:${colorOf(f)}"></i>`}${esc(f)}</button>`).join("");
  document.querySelectorAll("#filters .chip").forEach(b => b.onclick = () => { filter = b.dataset.f; shown = 15; renderFilters(); renderList(); });
}
function renderList(){
  const items = DATA.uploads.filter(u => filter === "All" || u.channel === filter);
  const list = document.getElementById("list");
  list.innerHTML = items.length ? items.slice(0, shown).map(u => `
    <a class="row" href="https://youtube.com/shorts/${encodeURIComponent(u.id)}" target="_blank" rel="noopener">
      <img class="thumb" loading="lazy" alt="" src="https://i.ytimg.com/vi/${encodeURIComponent(u.id)}/mqdefault.jpg" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb'}))">
      <div class="meta">
        <div class="title">${esc(u.hook || "Untitled clip")}</div>
        <div class="small">${u.streamer ? esc(u.streamer) + " · " : ""}${ago(u.at)}</div>
        <div class="tag"><i style="background:${colorOf(u.channel)}"></i>${esc(u.channel)}</div>
      </div>
    </a>`).join("") : `<div class="empty">No uploads yet.</div>`;
  const more = document.getElementById("more");
  more.hidden = items.length <= shown;
  more.onclick = () => { shown += 15; renderList(); };
}
renderFilters(); renderList();

// ---------- run history
document.getElementById("runs").innerHTML = DATA.runs.length ? DATA.runs.slice(0, 20).map(r => {
  const ok = !r.problems || !r.problems.length;
  const per = Object.entries(r.channels || {}).map(([ch, s]) =>
    `<span class="tag"><i style="background:${colorOf(ch)}"></i>${esc(ch)}: ${s.skipped ? "skipped" : `${s.uploaded} up${s.failed ? `, ${s.failed} failed` : ""}`}</span>`).join(" &nbsp; ");
  return `<div class="run">
    <div class="top"><b>${ok ? '<span style="color:var(--good)">✓</span>' : '<span style="color:var(--bad)">✗</span>'} ${fmt(r.started, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"})}</b>
    <span class="small">${r.trigger === "schedule" ? "scheduled" : "by hand"} · ${r.minutes} min</span></div>
    <div>${per}</div>
    ${ok ? "" : `<div class="prob">⚠ ${esc(r.problems.join("; "))}</div>`}
    ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Open log on GitHub →</a>` : ""}
  </div>`; }).join("") : `<div class="empty">The first run will show up here.</div>`;
</script>
